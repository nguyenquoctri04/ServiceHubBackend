services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: servicehub-rabbitmq-dev
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP Protocol (Microservices RPC & EventBus)
      - "15672:15672"  # RabbitMQ Management Web Dashboard
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-servicehub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-servicehub_secret_2026}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq # Lưu trữ dữ liệu bền vững (Queues & Persistent Messages)
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: servicehub-redis-dev
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_BROKER_PASSWORD:-123456789} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_BROKER_PASSWORD:-123456789}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  rabbitmq-data:
  redis-data:
