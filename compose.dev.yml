services:
  redis:
    image: redis:8-alpine
    container_name: servicehub-redis-dev
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_BROKER_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_BROKER_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data: