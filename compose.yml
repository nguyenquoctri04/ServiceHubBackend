    networks:
      - servicehub-net
    develop:
      watch:
        - action: sync+restart
          path: ./apps/catalog-service/src
          target: /usr/src/app/apps/catalog-service/src

        - action: sync+restart
          path: ./libs/common/src
          target: /usr/src/app/libs/common/src

        - action: rebuild
