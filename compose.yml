services:
  redis:
    image: redis:8-alpine
    container_name: servicehub-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_BROKER_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - servicehub-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_BROKER_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api-gateway
    container_name: servicehub-api-gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - 3000:3000   # DUY NHẤT service expose ra ngoài
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - servicehub-net
    develop:
      watch:
        - action: sync+restart
          path: ./apps/api-gateway/src
          target: /usr/src/app/apps/api-gateway/src

        - action: sync+restart
          path: ./libs/common/src
          target: /usr/src/app/libs/common/src

        - action: rebuild
          path: package.json

        - action: rebuild
          path: package-lock.json

  identity-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: identity-service
    container_name: servicehub-identity-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - servicehub-net
    develop:
      watch:
        - action: sync+restart
          path: ./apps/identity-service/src
          target: /usr/src/app/apps/identity-service/src

        - action: sync+restart
          path: ./libs/common/src
          target: /usr/src/app/libs/common/src

        - action: rebuild
          path: package.json

        - action: rebuild
          path: package-lock.json
    # KHÔNG có "ports:" — chỉ gọi được từ trong servicehub-net

  catalog-service:
